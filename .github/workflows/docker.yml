name: Publish Docker image
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  push_to_registry:
    name: Push Docker image to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #6.0.1
      -
        name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 #5.10.0
        with:
          images: ghcr.io/yoshinorin/docker-sbt
      -
        name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef #3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Select Dockerfile
        id: select_dockerfile
        run: |
          case "${{ github.ref_name }}" in
            v1.*) echo "file=Dockerfile.v1" >> "$GITHUB_OUTPUT" ;;
            v2.*) echo "file=Dockerfile.v2" >> "$GITHUB_OUTPUT" ;;
            *) echo "ERROR: no Dockerfile mapping for tag ${{ github.ref_name }}"; exit 1 ;;
          esac
      -
        name: Push to GitHub Packages
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #6.18.0
        with:
          push: true
          file: ${{ steps.select_dockerfile.outputs.file }}
          tags: ${{ steps.docker_meta.outputs.tags }}